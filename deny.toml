# Architecture dependency policy for S4MP (s4-* workspace).

[graph]
targets = []

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "reqwest", reason = "HTTP clients belong in future transport impls, not core" },
    { crate = "hyper", reason = "HTTP stack belongs in future s4-api transport impls" },
    { crate = "async-openai", reason = "LLM providers belong in plugins only" },
    { crate = "openai-api-rs", reason = "LLM providers belong in plugins only" },
    { crate = "anthropic", reason = "LLM providers belong in plugins only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.8
