# Architecture dependency policy for S4MP.
# Run: cargo deny check

[graph]
targets = []

[advisories]
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Tier 0-1 must never depend on LLM or HTTP client crates directly.
    { crate = "reqwest", reason = "HTTP clients belong in surface/API crates only" },
    { crate = "hyper", reason = "HTTP stack belongs in s4mp-api only" },
    { crate = "openai-api-rs", reason = "LLM providers belong in reasoner plugins only" },
    { crate = "async-openai", reason = "LLM providers belong in reasoner plugins only" },
    { crate = "anthropic", reason = "LLM providers belong in reasoner plugins only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0"]
confidence-threshold = 0.8
