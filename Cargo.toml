[workspace]
resolver = "2"
members = [
    "crates/s4-core",
    "crates/s4-storage",
    "crates/s4-events",
    "crates/s4-plugin",
    "crates/s4-project",
    "crates/s4-parser",
    "crates/s4-graph",
    "crates/s4-knowledge",
    "crates/s4-requirements",
    "crates/s4-metrics",
    "crates/s4-analysis",
    "crates/s4-verification",
    "crates/s4-certification",
    "crates/s4-llm",
    "crates/s4-cli",
]
exclude = ["crates/s4-api", "crates/s4-ui", "crates/s4-planner"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SynapticFour/S4MP"
rust-version = "1.75"
authors = ["SynapticFour"]

[workspace.dependencies]
# Internal — dependency direction: outer crates depend on inner only.
s4-core = { path = "crates/s4-core" }
s4-storage = { path = "crates/s4-storage" }
s4-events = { path = "crates/s4-events" }
s4-plugin = { path = "crates/s4-plugin" }
s4-project = { path = "crates/s4-project" }
s4-parser = { path = "crates/s4-parser" }
s4-graph = { path = "crates/s4-graph" }
s4-knowledge = { path = "crates/s4-knowledge" }
s4-requirements = { path = "crates/s4-requirements" }
s4-metrics = { path = "crates/s4-metrics" }
s4-analysis = { path = "crates/s4-analysis" }
s4-verification = { path = "crates/s4-verification" }
s4-certification = { path = "crates/s4-certification" }
s4-llm = { path = "crates/s4-llm" }

# External
walkdir = "2"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
tree-sitter = "0.24"
tree-sitter-java = "0.23.5"
tree-sitter-rust = "0.23.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = true

[profile.test]
debug = true

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
